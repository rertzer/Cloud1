- name: "Install inception"
  hosts: all
  remote_user: deploy
  vars:
    ansible_ssh_private_key_file: deploy_ed25519
  tasks:
    - name: "copy inception directory"
      copy:
        src: inception
        dest: /var/
        owner: "deploy"
        group: "deploy"
    - name: "Generate .env from template"
    - name: "create mariadb directory"
      template:
        src: .env
        dest: /var/inception/srcs/
        owner: "deploy"
        group: "deploy"
        mode: "0440"
    - name: "create wordpress directory"
      file:
        path: /var/data/wordpress
        owner: "deploy"
        group: "deploy"
        mode: "0700"
        state: "directory"
    - name: "Run Certificate Script"
      command: /var/inception/srcs/certificate/certif.sh
      chdir: /var/inception/
