- name: "Authorize port SSH (22)"
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

  ignore_errors: true

- name: "Authorize port HTTP (80)"
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  ignore_errors: true

- name: "Authorize port HTTPS (443)"
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  ignore_errors: true

- name: "Activate UFW"
  community.general.ufw:
    state: enabled
    policy: deny
  ignore_errors: true
