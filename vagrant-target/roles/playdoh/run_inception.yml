- name: Run Inception
  hosts: all
  remote_user: deploy
  vars:
    ansible_ssh_private_key_file: deploy_ed25519
  tasks:
    - name: Docker Compose
      community.docker.docker_compose_v2:
        project_src: /var/inception/srcs
        state: present
      register: output

    - name: Show running services
      ansible.builtin.debug:
        msg: "{{ output.containers | map(attribute='Name') | list }}"
